<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ares Case</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
<div class="app">
    <header class="top-header">
        <div class="live-wrapper">
            <span class="live-text">LIVE</span>

            <div class="live-items">
                <span>🎂</span>
                <span>🔥</span>
                <span>⚔️</span>
                <span>🧪</span>
                <span>🎰</span>
                <span>👑</span>
                <span>💣</span>
                <span>🪙</span>
                <span>🍀</span>
                <span>🃏</span>
                <span>💎</span>
                <span>🎁</span>
            </div>
        </div>

        <div class="balance-area">
            <div class="balance-pill" id="starBalance">⭐ 35</div>
            <div class="balance-pill blue" id="ticketBalance">🎟️ 2</div>
        </div>
    </header>

    <main class="screens">
        <section class="screen active" id="home-screen"></section>
        <section class="screen" id="raffles-screen"></section>
        <section class="screen" id="tasks-screen"></section>
        <section class="screen" id="leaderboard-screen"></section>
        <section class="screen" id="profile-screen"></section>
    </main>

    <nav class="bottom-navbar">
        <button class="nav-btn active" data-screen="home-screen">
            <span>🎁</span>
            <p>Cases</p>
        </button>

        <button class="nav-btn" data-screen="raffles-screen">
            <span>🎟️</span>
            <p>Raffles</p>
        </button>

        <button class="nav-btn" data-screen="tasks-screen">
            <span>📌</span>
            <p>Tasks</p>
        </button>

        <button class="nav-btn" data-screen="leaderboard-screen">
            <span>🌍</span>
            <p>Top</p>
        </button>

        <button class="nav-btn" data-screen="profile-screen">
            <span>👤</span>
            <p>Profile</p>
        </button>
    </nav>
</div>

<script src="app.js"></script>
</body>
</html>
