<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ares Case</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
<div class="app">
    <header class="top-header">
        <div class="balance-row">
            <button class="balance-card stars" id="starBalance">⭐ 35</button>
            <button class="balance-card tickets" id="ticketBalance">🎟️ 2</button>
        </div>

        <section class="live-section">
            <h1>LIVE</h1>
            <div class="live-track" id="liveTrack"></div>
        </section>
    </header>

    <main class="screen-container">
        <section class="screen active" id="home-screen"></section>
        <section class="screen" id="raffles-screen"></section>
        <section class="screen" id="tasks-screen"></section>
        <section class="screen" id="leaderboard-screen"></section>
        <section class="screen" id="profile-screen"></section>
    </main>

    <nav class="bottom-navbar">
        <button class="nav-btn active" data-screen="home-screen">
            <span>🎁</span>
            <p>Cases</p>
        </button>

        <button class="nav-btn" data-screen="raffles-screen">
            <span>🎟️</span>
            <p>Raffles</p>
        </button>

        <button class="nav-btn" data-screen="tasks-screen">
            <span>📌</span>
            <p>Tasks</p>
        </button>

        <button class="nav-btn" data-screen="leaderboard-screen">
            <span>🌍</span>
            <p>Top</p>
        </button>

        <button class="nav-btn" data-screen="profile-screen">
            <span>👤</span>
            <p>Profile</p>
        </button>
    </nav>
</div>

<script src="app.js"></script>
</body>
</html>
